data_name: "INVIS15"
model: "model.salt_prob.SALT_Prob"

optimizer: "RMSprop"
learning_rate: 5e-4
dropout_rate: 0.0

num_pre_epochs: 30
num_epochs: 300
win_size: 10
pred_size: 1


resume_last: False

Loss:
  name: "nll"
  alpha: 1.0
  theta: 0.1
  beta: 0.0     # 与 SALT_INN 完全一致的训练目标（edge-NLL + β·edge-MSE）；默认 0.0=纯 edge-NLL。
                 # 两概率模型差异仅在于 σ 是否与 μ 共享 TLSSM（SALT_Prob=共享, SALT_INN=解耦）。

feat_proj_dims:
  - 24
  - 32
  - 32

WLE:
  model_class: "model.modules.wle"
  in_channels: 37
  hidden_channels: 37
  out_channels: 1

TLSSM:
  model_class: "model.modules.tlssm"
  d_model: 1
  d_ssm: 1
  headdim: 1
  d_state: 4
  d_conv: 2
  rmsnorm: False

# ---- 早停机制（SALT train.py 读取）----
EarlyStop_patience: 30      # 连续 N 个 epoch 选优指标无改善(Δ<EarlyStop_min_delta) 即停止
EarlyStop_min_delta: 1.0e-4 # 改善幅度小于此值视为“无改善”

# ---- 模型选择准则（SALT_Prob 朴素概率化基线）----
# 可选: 'nll'(B) | 'rmse'(A) | 'combo'(C) | 'edge_rmse' | 'edge_combo'
#   'edge_rmse' : ★推荐用于公平点预测对比——仅真实边 RMSE，避开零元主导
#   'nll'       : 与 NLL 训练自洽；但 NLL 与 RMSE 反相关→易选中 σ 作弊的最差点预测 epoch
#   'rmse'(A)   : dense RMSE 被 99% 非边零元主导→epoch0 预测全零虚低（坑，勿用）
Selection: 'edge_rmse'   # SALT_Prob 作为对比基线，默认用公平的点预测尺（仅边）
Sel_lambda: 0.1     # combo / edge_combo 中 RMSE 的权重
Sel_norm: true       # true: 按首轮基准归一化 NLL/RMSE,使 λ 可解释; false: 原始 val_nll + λ·val_rmse
