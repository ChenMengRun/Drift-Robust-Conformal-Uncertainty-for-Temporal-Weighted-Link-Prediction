data_name: "INVIS15"
model: "model.salt_inn.SALT_INN"

optimizer: "RMSprop"
learning_rate: 5e-4     # 与 SALT 官方一致；freeze_mu 探针只训 σ 头，lr 不是变量，保持 5e-4
dropout_rate: 0.0

num_pre_epochs: 30
num_epochs: 30         # 探针：σ 头仅 38 参数，纯 edge-NLL 收敛快；30 足够看趋势
win_size: 10
pred_size: 1

resume_last: False

# ★ 探针开关：冻结 μ 主干(官方)，仅训 σ 头（异方差校准）
freeze_mu: true

Loss:
  name: "nll"
  alpha: 1.0
  theta: 0.1
  beta: 0.0     # freeze_mu 下 μ 已冻结，β·MSE 对 σ 头无梯度贡献，纯 edge-NLL 即可学校准 σ

feat_proj_dims:
  - 24
  - 32
  - 32

# 注意：out_channels 在 SALT_INN.__init__ 中被强制改为 2（mu_raw+logsig_raw）；
# TLSSM.d_model 被强制改为 1（仅 mu 过 TLSSM，log_sigma 走 INN 静态输出）。
WLE:
  model_class: "model.modules.inn"
  in_channels: 37
  hidden_channels: 37
  out_channels: 2

TLSSM:
  model_class: "model.modules.tlssm"
  d_model: 1
  d_ssm: 1
  headdim: 1
  d_state: 4
  d_conv: 2
  rmsnorm: False


# ---- 早停机制 ----
EarlyStop_patience: 40      # > num_epochs，确保跑满 30 epoch 看完整 σ 学习曲线
EarlyStop_min_delta: 1.0e-4
# ---- 模型选择准则 ----
# freeze_mu 探针用 'nll'：μ 冻结后 NLL 下降完全由 σ 校准驱动，选最低 NLL=最佳校准 epoch
Selection: 'nll'
Sel_lambda: 0.1
Sel_norm: true
