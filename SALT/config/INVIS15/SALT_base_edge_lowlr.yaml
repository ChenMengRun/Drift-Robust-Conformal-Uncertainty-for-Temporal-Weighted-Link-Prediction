data_name: "INVIS15"
model: "model.salt_edge.SALT_Edge"

optimizer: "RMSprop"
learning_rate: 1e-5
dropout_rate: 0.0

num_pre_epochs: 30
num_epochs: 50
win_size: 10
pred_size: 1


resume_last: False

# 选优准则：仅真实边 RMSE（避开 99% 非边零元主导），点预测公平性尺
Selection: "edge_rmse"

# —— 优化实验：edge 加权训练目标 + 极小 lr，从官方 9.88 起温和微调 μ ——
# 动机：base SALT 官方 9.88 是【密集】MAE+MSE 目标下的尖锐最优，同目标 finetune 不可能超越；
#       但本配置用 edge 加权 MAE+MSE 作训练目标（对齐评估指标 edge-RMSE），
#       并以 lr=1e-5（原 5e-4 的 1/50）从 9.88 平滑过渡，避免 loss 尺度突变把权重推飞。
# 预期：edge-RMSE 可能小幅低于 9.88（定向优化边），代价是 dense RMSE 略升；
#       若仍 >9.88 则说明该数据上 edge 加权目标在有限 epoch 内无增益。
Loss:
  name: "mae_and_mse"
  alpha: 40
  theta: 0.1

feat_proj_dims:
  - 24
  - 32
  - 32

WLE:
  model_class: "model.modules.wle"
  in_channels: 37
  hidden_channels: 37
  out_channels: 1

TLSSM:
  model_class: "model.modules.tlssm"
  d_model: 1
  d_ssm: 1
  headdim: 1
  d_state: 4
  d_conv: 2
  rmsnorm: False

# ---- 早停机制（SALT train.py 读取）----
EarlyStop_patience: 30      # 连续 N 个 epoch 选优指标无改善(Δ<EarlyStop_min_delta) 即停止
EarlyStop_min_delta: 1.0e-4
