data_name: "INVIS15"
model: "model.salt_inn.SALT_INN"

optimizer: "RMSprop"
learning_rate: 5e-4     # 保持与 SALT 官方一致(5e-4)。本轮只改 β 做单变量实验，lr 不动以隔离变量；若 β=3.0 仍卡住再单独调 lr。
dropout_rate: 0.0

num_pre_epochs: 30
num_epochs: 50        # 探针轮：早停 patience=30 已够，50 给余量看趋势；非最终训练量。
win_size: 10
pred_size: 1


resume_last: False

Loss:
  name: "nll"
  alpha: 1.0
  theta: 0.1
  beta: 3.0     # 复合损失权重：edge-NLL + β·edge-MSE（二者均为 edge-masked mean，同量纲）。
                 # ★ 演变：0.0=硬塌缩(μ=const,实测12.1) → 1.0=仍卡弱盆地(val RMSE_edge 12.07→12.04 不动,
                 #   G-Loss 3 epoch 仅降1.2%,因 MSE 仅占总损~6% 拉不动 μ) → 3.0=把 edge-MSE 提到更大约占比(粗略估计~25%,以实际 loss 分拆为准),
                 #   强制 μ 贴合边。代价 σ 更偏自信(校准降级),属诊断期可接受;若 σ 校准差再回拨 β 找平衡点。
                 #   注意：β 过大(→10+)会把 σ 压到 clamp 下限,毁掉路线 B 的校准意义,故 3.0 起、按需 2~5 区间调。

feat_proj_dims:
  - 24
  - 32
  - 32

# 注意：out_channels 在 SALT_INN.__init__ 中被强制改为 2（mu_raw+logsig_raw）；
# TLSSM.d_model 被强制改为 1（仅 mu 过 TLSSM，log_sigma 走 INN 静态输出）。
WLE:
  model_class: "model.modules.inn"
  in_channels: 37
  hidden_channels: 37
  out_channels: 2

TLSSM:
  model_class: "model.modules.tlssm"
  d_model: 1
  d_ssm: 1
  headdim: 1
  d_state: 4
  d_conv: 2
  rmsnorm: False


# ---- 早停机制（SALT train.py 读取）----
EarlyStop_patience: 30      # 连续 N 个 epoch 选优指标无改善(Δ<EarlyStop_min_delta) 即停止
EarlyStop_min_delta: 1.0e-4 # 改善幅度小于此值视为“无改善”
# ---- 模型选择准则（SALT_INN 路线 B）----
# 可选: 'nll'(B) | 'rmse'(A) | 'combo'(C) | 'edge_rmse' | 'edge_combo'
#   'nll'       : 与 NLL 训练自洽；但 NLL 与 RMSE 反相关→易选中 σ 作弊的最差点预测 epoch
#   'rmse'(A)   : dense RMSE 被 99% 非边零元主导→epoch0 预测全零虚低（坑，勿用）
#   'combo'(C)  : NLL 为主 + λ·denseRMSE 为辅
#   'edge_rmse' : ★推荐用于公平点预测对比——仅真实边 RMSE，避开零元主导；双模型(含 SALT)都报此才公平
#   'edge_combo': NLL 为主 + λ·仅边RMSE 为辅（既约束 μ 点精度，又保 σ 诚实）
Selection: 'edge_rmse'
Sel_lambda: 0.1     # combo / edge_combo 中 RMSE 的权重
Sel_norm: true       # true: 按首轮基准归一化 NLL/RMSE,使 λ 可解释; false: 原始 val_nll + λ·val_rmse
