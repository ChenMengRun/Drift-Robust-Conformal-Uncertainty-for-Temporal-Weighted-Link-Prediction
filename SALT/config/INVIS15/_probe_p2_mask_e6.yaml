data_name: "INVIS15"
model: "model.salt_dense.SALT_Dense"

# ===== 探针：P2 差分学习率（骨干冻结，仅训 TSF 新特征列）=====
tsf: true
backbone_lr_ratio: 0.0

optimizer: "RMSprop"
learning_rate: 1.0e-6
dropout_rate: 0.0

num_pre_epochs: 30
num_epochs: 300
win_size: 10
pred_size: 1

resume_last: False

Selection: "rmse"

Loss:
  name: "mae_and_mse"
  alpha: 40
  theta: 0.1

feat_proj_dims:
  - 24
  - 32
  - 32

WLE:
  model_class: "model.modules.wle"
  in_channels: 37
  hidden_channels: 37
  out_channels: 1

TLSSM:
  model_class: "model.modules.tlssm"
  d_model: 1
  d_ssm: 1
  headdim: 1
  d_state: 4
  d_conv: 2
  rmsnorm: False

EarlyStop_patience: 30
EarlyStop_min_delta: 1.0e-4
