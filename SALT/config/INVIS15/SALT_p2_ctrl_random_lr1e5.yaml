data_name: "INVIS15"
model: "model.salt_dense.SALT_Dense"

# ===== P2'：锚定官方权重的 TSF 读出协议 =====
# 骨干完全冻结，只训 feat_proj[0].weight 的新增 12 列（384 参数），lr=1e-6。
# 依据：官方 INVIS15 是尖锐最优点——整网 finetune lr=5e-4 → Test 2.78→4.38；
#       只训新列 lr=5e-4 → 4.02；lr=1e-6 → 2.81(守住) 且 ep1 降到 2.7347。
tsf: true
tsf_mode: "random"
backbone_lr_ratio: 0.0

optimizer: "RMSprop"
learning_rate: 1.0e-5
dropout_rate: 0.0

num_pre_epochs: 30
num_epochs: 300
win_size: 10
pred_size: 1

resume_last: False

Selection: "rmse"

Loss:
  name: "mae_and_mse"
  alpha: 40
  theta: 0.1

# 首层维度会被 trainer 自动改为 base_feat_dim + 12（INVIS15: 24 + 12 = 36）
feat_proj_dims:
  - 24
  - 32
  - 32

WLE:
  model_class: "model.modules.wle"
  in_channels: 37
  hidden_channels: 37
  out_channels: 1

TLSSM:
  model_class: "model.modules.tlssm"
  d_model: 1
  d_ssm: 1
  headdim: 1
  d_state: 4
  d_conv: 2
  rmsnorm: False

EarlyStop_patience: 30
EarlyStop_min_delta: 1.0e-4
