# HMob · edge 加权 finetune 探针（低速版，对照 SALT_base_edge.yaml）
# 与 SALT_base_edge.yaml 唯一差异：learning_rate=1e-5、num_epochs=50。
# 动机：INVIS15 上 lr=5e-4 直接发散(→12.07)，lr=1e-5 仅 epoch1 微改善后崩；
#       本配置在 HMob 上重测同一现象，验证“从密集最优点到边最优点是否本质不可微”。
# 运行：
#   python train.py --config ./SALT/config/HMob/SALT_base_edge_lowlr.yaml --finetune
data_name: "HMob"
model: "model.salt_edge.SALT_Edge"

optimizer: "RMSprop"
learning_rate: 1e-5
dropout_rate: 0.0

num_pre_epochs: 30
num_epochs: 50
win_size: 5
pred_size: 1

resume_last: False

# 选优准则：仅真实边 RMSE（避开 99% 非边零元主导），点预测公平性尺
Selection: "edge_rmse"

Loss:
  name: "mae_and_mse"
  alpha: 40
  theta: 0.1

feat_proj_dims:
  - 32
  - 32
  - 32

WLE:
  model_class: "model.modules.wle"
  in_channels: 96
  hidden_channels: 96
  out_channels: 1

TLSSM:
  model_class: "model.modules.tlssm"
  d_model: 1
  d_ssm: 1
  headdim: 1
  d_state: 4
  d_conv: 2
  rmsnorm: False

# ---- 早停机制（SALT train.py 读取）----
EarlyStop_patience: 30      # 连续 N 个 epoch 选优指标无改善(Δ<EarlyStop_min_delta) 即停止
EarlyStop_min_delta: 1.0e-4 # 改善幅度小于此值视为“无改善”
