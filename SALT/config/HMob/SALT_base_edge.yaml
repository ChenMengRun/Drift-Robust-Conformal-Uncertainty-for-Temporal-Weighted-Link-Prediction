# HMob · edge 加权 finetune 探针（复用 model.salt_edge.SALT_Edge，不改动 base SALT/salt.py/wle.py/Pretrained）
# 动机：base SALT 在 HMob 的强基线 = dense 10.70 / edge 26.31（edge/dense = 2.5）。
#       用 edge 加权 MAE+MSE 直接从官方 backbone finetune，选优准则 = val edge-RMSE，
#       直接对齐评测口径，验证“从密集最优点能否把边 RMSE 往下拉”。
# 运行（在你装好数据/官方权重的那份代码里）：
#   python train.py --config ./SALT/config/HMob/SALT_base_edge.yaml --finetune
# 注意：若 Exp/pt/HMob/model.salt_edge.SALT_Edge/resume.ckpt 已存在会续训；
#       要强制从官方 backbone 重 finetune，先删该 resume.ckpt（或整目录）。
data_name: "HMob"
model: "model.salt_edge.SALT_Edge"

optimizer: "RMSprop"
learning_rate: 5e-4
dropout_rate: 0.0

num_pre_epochs: 30
num_epochs: 30
win_size: 5
pred_size: 1

resume_last: False

# 选优准则：仅真实边 RMSE（避开 99% 非边零元主导），点预测公平性尺
Selection: "edge_rmse"

Loss:
  name: "mae_and_mse"
  alpha: 40
  theta: 0.1

feat_proj_dims:
  - 32
  - 32
  - 32

WLE:
  model_class: "model.modules.wle"
  in_channels: 96
  hidden_channels: 96
  out_channels: 1

TLSSM:
  model_class: "model.modules.tlssm"
  d_model: 1
  d_ssm: 1
  headdim: 1
  d_state: 4
  d_conv: 2
  rmsnorm: False

# ---- 早停机制（SALT train.py 读取）----
EarlyStop_patience: 30      # 连续 N 个 epoch 选优指标无改善(Δ<EarlyStop_min_delta) 即停止
EarlyStop_min_delta: 1.0e-4 # 改善幅度小于此值视为“无改善”
